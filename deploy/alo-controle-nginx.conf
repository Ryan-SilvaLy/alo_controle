# Arquivo de configuração Nginx para ALO Controle
# Salvar em: /etc/nginx/sites-available/alo-controle
# Depois criar link simbólico: ln -s /etc/nginx/sites-available/alo-controle /etc/nginx/sites-enabled/

upstream alo_controle_backend {
    server unix:/run/alo-controle.sock fail_timeout=0;
}

server {
    # Redireciona HTTP para HTTPS
    listen 80;
    listen [::]:80;
    server_name seu-dominio.com www.seu-dominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seu-dominio.com www.seu-dominio.com;

    # Certificados SSL (gerar com Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seu-dominio.com/privkey.pem;

    # Configurações SSL seguras
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Limite de tamanho de upload
    client_max_body_size 100M;

    # Raiz do frontend (Angular build)
    root /var/www/alo_controle/frontend/dist/frontend;

    # Logs
    access_log /var/log/nginx/alo_controle_access.log;
    error_log /var/log/nginx/alo_controle_error.log;

    # ====== FRONTEND (Angular SPA) ======
    location / {
        # Serve index.html para rotas não encontradas (necessário para SPA)
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ====== ARQUIVOS ESTÁTICOS DO FRONTEND ======
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ====== ARQUIVOS ESTÁTICOS DO BACKEND ======
    location /static/ {
        alias /var/www/alo_controle/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ====== ARQUIVOS DE MÍDIA (uploads) ======
    location /media/ {
        alias /var/www/alo_controle/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ====== API BACKEND ======
    location /api/ {
        proxy_pass http://alo_controle_backend;
        proxy_http_version 1.1;
        
        # Headers necessários para o proxy funcionar corretamente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # Desativa buffering para streaming de respostas
        proxy_buffering off;
    }

    # ====== ADMIN DJANGO ======
    location /admin/ {
        proxy_pass http://alo_controle_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Nega acesso a .env e arquivos perigosos
    location ~ /\.env {
        deny all;
    }

    location ~ /\.git {
        deny all;
    }
}
