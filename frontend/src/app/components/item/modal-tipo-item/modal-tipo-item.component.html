<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
  *ngIf="mostrarModal"
>
  <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-lg">
    <h3 class="text-xl text-black font-semibold mb-4">Criar novo tipo de item</h3>
<input
  type="text"
  placeholder="Nome do tipo"
  maxlength="50"
  [(ngModel)]="novoTipoNome"
  class="w-full px-4 py-2 border rounded mb-4 text-black"
/>

    <label class="mb-1 block text-sm text-slate-700">Dias de cobertura</label>
    <select
      [(ngModel)]="novoTipoDiasCobertura"
      class="w-full px-4 py-2 border rounded mb-4 text-black"
    >
      <option *ngFor="let periodo of periodosCobertura" [ngValue]="periodo">
        {{ periodo }} dias
      </option>
    </select>

    <div class="flex justify-end gap-3">
      <button
        class="btn btn-outline-secondary"
        (click)="fechar()"
        [disabled]="carregando"
      >
        Cancelar
      </button>
      <button
        class="btn btn-primary"
        (click)="criarTipoItem()"
        [disabled]="carregando"
      >
        {{ carregando ? 'Salvando...' : 'Salvar' }}
      </button>
    </div>
  </div>
</div>
